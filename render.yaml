services:
  - type: web
    name: switchboard
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      # Required. The console refuses to serve without it.
      - key: APP_PASSWORD
        sync: false

      # Records live outside the container so the do-not-call list and attempt
      # counts survive a restart or spin-down. With these set, live calling is
      # permitted; without them the console falls back to rehearsal only.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Left at 1 deliberately: it is the safety net. If the storage settings
      # above are ever removed, the console drops back to rehearsal rather than
      # dialling with a do-not-call list it cannot keep.
      - key: EPHEMERAL_STORAGE
        value: "1"

      # 0 places real calls. Set to 1 to rehearse.
      - key: DRY_RUN
        value: "0"

      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
